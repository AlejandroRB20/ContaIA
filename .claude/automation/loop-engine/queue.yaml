# Cola de tarjetas del Loop Engine — VERSIONADA.
#
# Este archivo declara INTENCIÓN: qué tarjetas existen, su contrato, sus
# dependencias y su estado inicial. NO es estado de ejecución: eso vive en
# `state/` y está ignorado por Git. El runtime NUNCA reescribe este archivo
# (arquitectura §8, misión LOOP-001 T7).
#
# Fuente de las siete tarjetas de abajo: `.claude/automation/nightly-queue.md`,
# transcritas SIN cambiar su estado operativo ni sus dependencias, como exige
# el criterio de aceptación de LOOP-001 (arquitectura §19).
#
# Mapeo de vocabulario aplicado (la cola nocturna usa estados operativos
# propios que no pertenecen a la máquina canónica de §3.2):
#
#   READY_FOR_REVIEWS        -> READY_FOR_QA   (≡ READY_FOR_AUDIT, §3.1)
#   BLOCKED                  -> BLOCKED        (idéntico)
#   WAITING_FOR_SCOPE_ORDER  -> BLOCKED        (espera autorización humana)
#
# Ninguna de las siete queda en READY, así que ninguna es despachable: la
# autoridad para iniciarlas está reservada a Alejandro (`nightly-queue.md`
# §"Autoridad reservada a Alejandro"), y el motor no la sustituye.
#
# Tampoco declaran `base_commit`, `allowed_write` ni `test_commands`: la cola
# nocturna no los fija, e inventarlos las volvería despachables con un alcance
# fabricado. Por eso permanecen BLOCKED — es exactamente la regla de §3.2
# ("Si falta un campo del contrato → BLOCKED"), no una omisión.

